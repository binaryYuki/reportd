# Full reportd stack: the app, its MySQL database, and (optionally) an HTTPS
# reverse proxy.
#
#   1. cp .env.example .env    and fill it in
#   2. docker compose up -d                     # app on http://<host>:8080
#      docker compose --profile https up -d     # plus HTTPS on 80/443
#
# Browsers only send reports to HTTPS endpoints, so a public deployment needs
# the "https" profile or your own TLS-terminating proxy in front of port 8080
# (it must send "X-Forwarded-Proto: https").
#
# Register https://<your-domain>/auth/callback as the GitHub OAuth app's
# authorization callback URL.
#
# To use an external database (for example Oracle MySQL HeatWave) instead,
# delete the "db" service and reportd's "depends_on", and set
# REPORTD_DATABASE_URL to mysql://user:password@host:3306/database?tls=true.
name: reportd

services:
  reportd:
    # "latest" follows main. Pin a build with akkk1234/reportd:sha-<commit>.
    image: akkk1234/reportd:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${REPORTD_PORT:-8080}:8080"
    environment:
      REPORTD_DATABASE_URL: mysql://reportd:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/reportd
      REPORTD_GITHUB_CLIENT_ID: ${REPORTD_GITHUB_CLIENT_ID:?set REPORTD_GITHUB_CLIENT_ID in .env}
      REPORTD_GITHUB_CLIENT_SECRET: ${REPORTD_GITHUB_CLIENT_SECRET:?set REPORTD_GITHUB_CLIENT_SECRET in .env}
      REPORTD_ALLOWED_EMAILS: ${REPORTD_ALLOWED_EMAILS:?set REPORTD_ALLOWED_EMAILS in .env}
      REPORTD_SESSION_SECRET: ${REPORTD_SESSION_SECRET:?set REPORTD_SESSION_SECRET in .env}
      # Oldest rows are deleted beyond this many GB of table storage.
      REPORTD_MAX_STORAGE_GB: ${REPORTD_MAX_STORAGE_GB:-5}
      # Make the Go runtime collect garbage before the memory limit below.
      GOMEMLIMIT: 400MiB
    healthcheck:
      # 503 here means database writes are failing; see the README.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 512M
    # Lets queued reports be written out before the container is killed.
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Tuned for a small host. Binary logs are off: nothing replicates from
    # this server, and they would grow outside reportd's storage cap.
    command:
      - --skip-log-bin
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=20
      - --character-set-server=utf8mb4
    environment:
      MYSQL_DATABASE: reportd
      MYSQL_USER: reportd
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ureportd -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    logging: *logging

  # HTTPS with an automatic Let's Encrypt certificate. The domain's DNS must
  # point at this host and ports 80 and 443 must be reachable.
  caddy:
    profiles:
      - https
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - reportd
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${REPORTD_DOMAIN:-localhost}
      - --to
      - reportd:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  # The database. Back this up; deleting it deletes every report.
  db-data:
  # TLS certificates and Caddy state.
  caddy-data:
  caddy-config:
