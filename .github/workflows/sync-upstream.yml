name: Sync upstream
on:
  schedule:
    # Daily at 03:17 UTC; off the hour, when scheduled runs are least delayed.
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
env:
  UPSTREAM_REPO: icco/reportd
  UPSTREAM_BRANCH: main
  SELF: .github/workflows/sync-upstream.yml
jobs:
  sync:
    runs-on: ubuntu-latest
    # Upstream itself has nothing to pull from.
    if: github.repository != 'icco/reportd'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date with ${UPSTREAM_REPO}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" || true

          # This repository keeps no workflow but this one. Drop whatever
          # upstream added or changed under .github/workflows; that also
          # settles the conflicts its edits to the deleted files cause, and
          # keeps the push within what the default GITHUB_TOKEN may do.
          git ls-files -- .github/workflows | sort -u |
            grep -vx "${SELF}" | xargs -r git rm -f -q --

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "${conflicts}" ]; then
            echo "::error::Upstream changes conflict with this repository. Merge ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} by hand."
            echo "${conflicts}"
            git merge --abort
            exit 1
          fi

          git commit -q -m "chore: merge upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Setup Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A merge can apply cleanly and still break the build; never push that.
      - name: Test the merge
        if: steps.merge.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./...
      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
